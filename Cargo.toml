[workspace]
members = ["crates/core", "crates/server", "crates/client"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.29", features = ["serde"] }
sauerteig-core = { path = "crates/core" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 2
lto = "thin"
strip = true

