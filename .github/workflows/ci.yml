name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Install Linux window dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build server and native client
        run: cargo build --locked -p sauerteig-server -p sauerteig-client
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build browser client
        run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sauerteig-web
          path: web/dist
