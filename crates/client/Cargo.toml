[package]
name = "sauerteig-client"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "sauerteig-client"

[dependencies]
sauerteig-core.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
wgpu = "24"
winit = "0.30"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["clipboard"] }
bytemuck = { version = "1", features = ["derive"] }
ewebsock = { version = "0.8", features = ["tls"] }
log = "0.4"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4"
env_logger = "0.11"
rodio = { version = "0.20.1", default-features = false }
sauerteig-server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["NSAlert", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["NSString"] }
