[package]
name = "sauerteig-client"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "sauerteig-client"

[dependencies]
sauerteig-core.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
wgpu = "24"
winit = "0.30"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["clipboard"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4"
env_logger = "0.11"
rodio = { version = "0.20.1", default-features = false }
sauerteig-server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["NSAlert", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["NSString"] }
