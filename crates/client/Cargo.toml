[package]
name = "sauerteig-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sauerteig-core.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
wgpu = "24"
winit = "0.30"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
ewebsock = { version = "0.8", features = ["tls"] }
log = "0.4"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.31", default-features = false, features = ["clipboard"] }
pollster = "0.4"
env_logger = "0.11"
rodio = { version = "0.20.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"
web-sys = { version = "=0.3.77", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "UrlSearchParams", "CustomEvent", "EventTarget", "HtmlElement", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "GainNode", "OscillatorNode", "OscillatorType", "HtmlTextAreaElement", "InputEvent", "CompositionEvent", "ClipboardEvent", "DataTransfer", "KeyboardEvent", "Navigator", "Clipboard", "CssStyleDeclaration"] }
console_error_panic_hook = "0.1"
console_log = "1"

